name: Security Scans

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "15 2 * * 6"

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Export locked runtime dependencies
        run: >-
          uv export --locked --no-dev --no-emit-project
          --format requirements-txt --output-file /tmp/requirements.txt
      - name: Audit locked dependencies
        run: uv run --with pip-audit pip-audit -r /tmp/requirements.txt

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan repository for secrets
        run: >-
          docker run --rm
          --volume "$PWD:/repo"
          zricethezav/gitleaks:v8.24.2
          detect --source=/repo --no-banner --redact
