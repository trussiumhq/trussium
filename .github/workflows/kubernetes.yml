name: Kubernetes

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Render and Kind Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Kind
        uses: helm/kind-action@v1
        with:
          cluster_name: trussium-ci
          wait: 60s

      - name: Validate Kubernetes manifests
        run: scripts/kubernetes-validate.sh

      - name: Deploy to Kind and smoke test
        run: scripts/kubernetes-smoke-test.sh
        env:
          TRUSSIUM_KIND_CLUSTER: trussium-ci
