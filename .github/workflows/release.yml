name: Release

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Capture current release tag
        id: previous-release
        run: |
          tag="$(git tag --list 'v*' --sort=-version:refname | head -n 1)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Run Semantic Release
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: uv run semantic-release version

      - name: Detect a newly created release
        id: release
        env:
          PREVIOUS_RELEASE_TAG: ${{ steps.previous-release.outputs.tag }}
        run: |
          git fetch --force --tags origin
          tag="$(git tag --list 'v*' --sort=-version:refname | head -n 1)"
          if [ "$tag" != "$PREVIOUS_RELEASE_TAG" ]; then
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate release packages
        if: steps.release.outputs.tag != ''
        run: scripts/package-smoke-test.sh "$GITHUB_WORKSPACE/dist"

      - name: Publish release packages
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: uv run semantic-release publish --tag "$RELEASE_TAG"

      - name: Dispatch container publication
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh workflow run container.yml --ref "$RELEASE_TAG"
