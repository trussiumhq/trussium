name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  openai-sdk-compatibility:
    name: OpenAI SDK ${{ matrix.openai-specifier }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        openai-specifier:
          - "openai==2.48.0"
          - "openai>=3,<4"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install locked development dependencies
        run: uv sync

      - name: Select SDK compatibility target
        run: uv pip install --python .venv/bin/python '${{ matrix.openai-specifier }}'

      - name: MyPy
        run: uv run --no-sync mypy src tests

      - name: Provider and runtime tests
        run: uv run --no-sync pytest -q tests/unit tests/integration/test_chat_runtime.py

  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: MyPy
        run: uv run mypy src tests

      - name: Unit tests
        run: uv run pytest tests/unit

      - name: Integration tests
        run: uv run pytest tests/integration -m "not ollama"

  package:
    name: Package Build and Installation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build and validate distribution packages
        run: scripts/package-smoke-test.sh

  dashboards:
    name: Grafana Dashboard Import
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Provision dashboards in Grafana
        run: scripts/dashboard-smoke-test.sh

  alert-rules:
    name: Prometheus Alert Rule Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate alert rules and synthetic scenarios
        run: scripts/alert-rules-smoke-test.sh
