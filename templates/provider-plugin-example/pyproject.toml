[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "trussium-provider-example"
version = "0.1.0"
description = "Copyable example provider plugin for Trussium."
requires-python = ">=3.12"
dependencies = ["trussium>=0.59.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/trussium_provider_example"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
