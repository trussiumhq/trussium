apiVersion: apps/v1
kind: Deployment
metadata:
  name: trussium
  labels:
    app.kubernetes.io/name: trussium
    app.kubernetes.io/instance: trussium
    app.kubernetes.io/component: runtime
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trussium
      app.kubernetes.io/instance: trussium
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trussium
        app.kubernetes.io/instance: trussium
        app.kubernetes.io/component: runtime
    spec:
      serviceAccountName: trussium
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 36
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: trussium
          image: ghcr.io/trussiumhq/trussium:0.23.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 9000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: trussium
            - secretRef:
                name: trussium-provider
                optional: true
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
